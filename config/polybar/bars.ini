[bar/base]
monitor = ${env:MONITOR:}
height = 36
offset-y = 10
radius = 18
fixed-center = true
background = ${colors.surface}
foreground = ${colors.text}
line-size = 2
border-size = 0
padding-left = 1
padding-right = 1
module-margin = 1
font-0 = JetBrainsMono Nerd Font:size=10;2
font-1 = Symbols Nerd Font Mono:size=12;2
wm-restack = bspwm
enable-ipc = true
cursor-click = pointer
cursor-scroll = ns-resize

[bar/left]
inherit = bar/base
width = 29%
offset-x = 1%
modules-left = launcher network vpn

[bar/center]
inherit = bar/base
width = 18%
offset-x = 31%
modules-center = bspwm

[bar/right]
inherit = bar/base
width = 49%
offset-x = 50%
modules-right = target cpu memory pulseaudio battery date tray power

