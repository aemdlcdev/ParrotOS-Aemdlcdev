[bar/base]
monitor = ${env:MONITOR:}
height = 40
offset-y = 15
radius = 20
fixed-center = true
background = ${colors.surface}
foreground = ${colors.text}
line-size = 0
border-size = 0
padding-left = 0
padding-right = 0
module-margin = 0
font-0 = Iosevka Nerd Font:size=13;3
font-1 = Hack Nerd Font Mono:size=13;3
wm-restack = bspwm
enable-ipc = true
cursor-click = pointer

[bar/launcher]
inherit = bar/base
width = 2.7%
offset-x = 1%
modules-center = launcher

[bar/network]
inherit = bar/base
width = 10%
offset-x = 3%
modules-center = network

[bar/vpn]
inherit = bar/base
width = 10%
offset-x = 12.3%
modules-center = vpn

[bar/workspaces]
inherit = bar/base
width = 18%
offset-x = 41%
background = ${colors.background}
modules-center = bspwm

[bar/target]
inherit = bar/base
width = 17%
offset-x = 55.7%
modules-center = target

[bar/power]
inherit = bar/base
width = 2.5%
offset-x = 96.9%
background = ${colors.background}
modules-center = power

; Módulos conservados para una barra opcional, no iniciada por defecto.
[bar/diagnostics]
inherit = bar/base
width = 20%
offset-x = 75%
modules-center = cpu memory pulseaudio battery date tray
