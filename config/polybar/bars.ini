[bar/base]
monitor = ${env:MONITOR:}
height = 40
offset-y = 15
radius = 20
fixed-center = true
background = ${colors.surface}
foreground = ${colors.text}
line-size = 0
border-size = 0
padding-left = 1
padding-right = 1
module-margin = 1
font-0 = Iosevka Nerd Font:size=13;3
font-1 = Hack Nerd Font Mono:size=13;3
wm-restack = bspwm
enable-ipc = true
cursor-click = pointer
cursor-scroll = ns-resize

[bar/launcher]
inherit = bar/base
width = 2.7%
offset-x = 1%
modules-center = launcher

[bar/network]
inherit = bar/base
width = 10%
offset-x = 4%
modules-center = network

[bar/vpn]
inherit = bar/base
width = 10%
offset-x = 14.5%
modules-center = vpn

[bar/workspaces]
inherit = bar/base
width = 18%
offset-x = 41%
modules-center = bspwm

[bar/system]
inherit = bar/base
width = 20.5%
offset-x = 59.5%
modules-center = cpu memory pulseaudio battery date tray

[bar/target]
inherit = bar/base
width = 15.5%
offset-x = 80.5%
modules-center = target

[bar/power]
inherit = bar/base
width = 2.5%
offset-x = 96.5%
modules-center = power
