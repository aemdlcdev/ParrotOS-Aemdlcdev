[module/launcher]
type = custom/text
content = 󰣇
content-foreground = ${colors.accent}
click-left = rofi -show drun -theme ~/.config/aemdlc-environment/rofi/launcher.rasi

[module/bspwm]
type = internal/bspwm
label-focused = %name%
label-focused-foreground = ${colors.background}
label-focused-background = ${colors.accent}
label-focused-padding = 1
label-occupied = %name%
label-occupied-foreground = ${colors.text}
label-occupied-padding = 1
label-empty = ·
label-empty-foreground = ${colors.muted}
label-empty-padding = 1
label-urgent = %name%
label-urgent-background = ${colors.alert}
label-urgent-padding = 1

[module/network]
type = custom/script
exec = ~/.local/share/aemdlc-environment/bin/network-status
interval = 4

[module/vpn]
type = custom/script
exec = ~/.local/share/aemdlc-environment/bin/vpn-status
interval = 3

[module/target]
type = custom/script
exec = ~/.local/share/aemdlc-environment/bin/target-status
interval = 2

[module/cpu]
type = internal/cpu
interval = 2
format-prefix = "CPU "
format-prefix-foreground = ${colors.accent}
label = %percentage:2%%

[module/memory]
type = internal/memory
interval = 3
format-prefix = "RAM "
format-prefix-foreground = ${colors.accent2}
label = %percentage_used%%

[module/pulseaudio]
type = internal/pulseaudio
format-volume = 󰕾 <label-volume>
format-muted = 󰝟 muted
format-muted-foreground = ${colors.muted}
click-right = pavucontrol

[module/battery]
type = custom/script
exec = ~/.local/share/aemdlc-environment/bin/battery-status
interval = 15

[module/date]
type = internal/date
interval = 1
date = %d/%m
time = %H:%M
label = %date%  %time%

[module/power]
type = custom/text
content = ⏻
content-foreground = ${colors.alert}
click-left = ~/.local/share/aemdlc-environment/bin/power-menu

[module/tray]
type = internal/tray
tray-spacing = 6px

